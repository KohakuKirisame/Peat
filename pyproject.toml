[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peat-invest"
version = "0.2.0"
description = "Self-hosted investment intelligence with Trading 212, local news and AI"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{name = "KohakuKirisame", email = "f.cao@students.uu.nl"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "argon2-cffi>=23.1,<26", "cryptography>=44,<48", "feedparser>=6,<7",
  "exchange-calendars>=4.8,<5", "python-multipart>=0.0.20,<1", "defusedxml>=0.7,<1",
  "python-dotenv>=1,<2", "trafilatura>=2.1,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
peat = "peat.__main__:main"

[tool.setuptools.packages.find]
include = ["peat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
